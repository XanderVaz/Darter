name: Build Linux Installer

on:
  push:
    tags:
      - 'v*' # Se activa solo cuando subes un tag como v0.1.4

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para publicar el instalador en Releases

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Obtener versión desde el tag
        id: get_version
        run: |
          # Quita la "v" inicial (ej: v0.1.4 -> 0.1.4)
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Instalar dependencias de Linux para Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar paquetes y compilar
        run: |
          flutter pub get
          flutter build linux --release

      - name: Empaquetar instalador .deb con versión dinámica
        run: |
          PKG_NAME="Darter-${{ env.VERSION }}-linux-x64.deb"
          
          mkdir -p darter-deb/DEBIAN
          mkdir -p darter-deb/usr/local/bin/darter
          mkdir -p darter-deb/usr/share/applications
          
          # Copiar archivos compilados
          cp -r build/linux/x64/release/bundle/* darter-deb/usr/local/bin/darter/
          chmod +x darter-deb/usr/local/bin/darter/darter
          
          # Archivo de control con la versión del tag
          cat <<EOF > darter-deb/DEBIAN/control
          Package: darter
          Version: ${{ env.VERSION }}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: XanderVaz
          Description: IDE para Flutter y Dart
          EOF

          # Acceso directo en el menú de aplicaciones
          cat <<EOF > darter-deb/usr/share/applications/darter.desktop
          [Desktop Entry]
          Name=Darter
          Comment=IDE para Flutter y Dart
          Exec=/usr/local/bin/darter/darter
          Type=Application
          Categories=Development;IDE;
          EOF

          # Construir el archivo .deb final
          dpkg-deb --build darter-deb "$PKG_NAME"
          echo "DEB_FILE=$PKG_NAME" >> $GITHUB_ENV

      - name: Adjuntar instalador a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB_FILE }}
