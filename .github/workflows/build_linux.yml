name: Build Linux Installer

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cuando subes un tag como v0.1.4

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Obligatorio para poder adjuntar archivos al Release

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Extraer versión del tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Instalar dependencias de Linux para Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar paquetes y compilar
        run: |
          flutter pub get
          flutter build linux --release

      - name: Crear paquete .deb con versión dinámica
        run: |
          PKG_NAME="Darter-${{ env.VERSION }}-linux-x64.deb"
          
          mkdir -p darter-deb/DEBIAN
          mkdir -p darter-deb/usr/local/bin/darter
          mkdir -p darter-deb/usr/share/applications
          
          # Copiar todos los archivos compilados
          cp -r build/linux/x64/release/bundle/* darter-deb/usr/local/bin/darter/
          
          # Detectar automáticamente el nombre del ejecutable principal
          EXEC_NAME=$(find darter-deb/usr/local/bin/darter -maxdepth 1 -type f -executable -printf "%f\n" | head -n 1)
          chmod +x "darter-deb/usr/local/bin/darter/$EXEC_NAME"
          
          cat <<EOF > darter-deb/DEBIAN/control
          Package: darter
          Version: ${{ env.VERSION }}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: XanderVaz
          Description: IDE para Flutter y Dart
          EOF

          cat <<EOF > darter-deb/usr/share/applications/darter.desktop
          [Desktop Entry]
          Name=Darter
          Comment=IDE para Flutter y Dart
          Exec=/usr/local/bin/darter/$EXEC_NAME
          Type=Application
          Categories=Development;IDE;
          EOF

          dpkg-deb --build darter-deb "$PKG_NAME"
          echo "DEB_FILE=$PKG_NAME" >> $GITHUB_ENV


      - name: Publicar instalador en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB_FILE }}
